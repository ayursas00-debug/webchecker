name: Estonia D-Visa Checker (New Delhi)

on:
  schedule:
    # Every 5 minutes, 04:00-12:59 UTC (covers 09:30-18:29 IST with buffer
    # around a 10:00-18:00 working window; check_once.py double-checks the
    # exact window itself and skips outside it).
    - cron: "*/5 4-12 * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the visa checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_once.py


